name: Desktop UI

on:
  push:
    branches: [desktop-ui]
  pull_request:
    paths:
      - "brain/ui/**"
      - "tests/ui/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-ui.yml"

jobs:
  windows-qt-tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop-test]"
      - run: python -m pytest tests/ui
