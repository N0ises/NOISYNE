[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phasenox"
version = "1.0.0"
description = "PHASENØX modular audio intelligence platform."
readme = "docs/README_v2.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hamid Haddadi" }
]

keywords = [
    "audio",
    "ai",
    "music",
    "machine-learning",
    "llm",
    "rag",
    "embedding",
    "analysis",
    "reference",
    "phasenox"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "sentence-transformers",
    "accelerate",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pyloudnorm",
    "chromadb",
    "langchain-core",
    "langchain-text-splitters",
    "openai",
    "requests",
    "pydantic",
    "PyYAML",
    "tqdm",
]

[project.optional-dependencies]
# PDF/OCR ingestion is only required for RAG corpus building, not for the core
# V1 analyze/reference runtime. Install with `pip install phasenox[pdf]`.
pdf = [
    "pymupdf",
    "marker-pdf",
    "paddleocr",
]
# Performance/ONNX benchmarking extras are optional; core V2 remains independent of ONNX.
performance = [
    "onnxruntime",
    "onnx",
    "psutil",
]
desktop = [
    "PySide6>=6.8,<7",
]
desktop-test = [
    "PySide6>=6.8,<7",
    "pytest-qt>=4.4,<5",
]

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[project.scripts]
phasenox = "phasenox.cli:main"

[project.urls]
Repository = "https://github.com/N0ises/PHASENOX"
Issues = "https://github.com/N0ises/PHASENOX/issues"

[tool.setuptools.package-data]
"phasenox.infrastructure.config" = ["resources/*.yaml"]
"phasenox.resources.branding" = ["*.png", "*.svg"]

[tool.setuptools.packages.find]
include = ["phasenox*", "brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
