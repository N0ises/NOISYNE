[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbrain"
version = "1.0.0"
description = "AI-powered modular audio intelligence platform."
readme = "docs/README_v2.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hamid Haddadi" }
]

keywords = [
    "audio",
    "ai",
    "music",
    "machine-learning",
    "llm",
    "rag",
    "embedding",
    "analysis",
    "reference",
    "soundbrain"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "sentence-transformers",
    "accelerate",
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pyloudnorm",
    "chromadb",
    "langchain-core",
    "langchain-text-splitters",
    "openai",
    "requests",
    "pydantic",
    "PyYAML",
    "tqdm",
]

[project.optional-dependencies]
# PDF/OCR ingestion is only required for RAG corpus building, not for the core
# V1 analyze/reference runtime. Install with `pip install soundbrain[pdf]`.
pdf = [
    "pymupdf",
    "marker-pdf",
    "paddleocr",
]

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[project.scripts]
soundbrain = "brain.cli:main"

[tool.setuptools.package-data]
"brain.infrastructure.config" = ["resources/*.yaml"]

[tool.setuptools.packages.find]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
