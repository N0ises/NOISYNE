[pytest]
testpaths = tests
norecursedirs = archive output output2 __pycache__
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --basetemp=tmp

filterwarnings =
    ignore::DeprecationWarning

markers =
    unit: Qt-free contract and state tests
    component: individual Qt widget and page tests
    integration: multiple desktop UI layers through stable contracts
    e2e: full desktop workflow through DesktopApplicationAdapter
    performance: bounded desktop responsiveness and regression-budget checks
    stress: longer deterministic repetition and retained-resource checks
