[pytest]
testpaths = tests
norecursedirs = archive output output2 __pycache__
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --basetemp=tmp

markers =
    packaging: builds and installs distribution artifacts in an isolated environment

filterwarnings =
    ignore::DeprecationWarning
