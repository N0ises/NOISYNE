# PHASENØX Runtime Configuration
# Centralizes execution environment, device selection, and filesystem paths.
# All paths are relative to the project root and support ~ expansion.

runtime:
  # Device selection strategy.
  # auto   = prefer CUDA if available, otherwise CPU
  # cpu    = force CPU
  # cuda   = first available CUDA device
  # cuda:N = specific CUDA device index
  device: auto

  # Default dtype when a model does not specify one.
  # auto    = float16 on CUDA, float32 on CPU
  # float16 = half precision
  # float32 = full precision
  dtype: auto

  # Lazy-load models on first use instead of at startup.
  lazy_load: true

  # Root directory used by ModelRepository to find local model folders.
  # Relative to the project root. Models are expected as <model_root>/<model_name>.
  model_root: ../Models

  # Directory where downloaded/cached model weights are stored.
  # ModelRepository resolves local model folders under this path.
  model_cache_dir: data/cache/models

  # Runtime working cache for intermediate assets.
  cache_dir: data/cache

  # Directory for application logs.
  log_dir: logs

  # Directory for generated reports.
  report_dir: reports

logging:
  # Console/file log level: DEBUG | INFO | WARNING | ERROR
  level: INFO

  # Output format: text | json
  format: text
